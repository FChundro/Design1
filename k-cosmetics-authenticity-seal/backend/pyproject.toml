[project]
name = "kc-seal"
version = "0.1.0"
description = "K-Cosmetics EU live heartbeat digital authenticity seal - PROTOTYPE (not deployed)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=43",
    "pydantic>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["kc_seal_tests"]
pythonpath = ["."]
addopts = "-q"
